<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فایل‌های صوتی</title>

<style>
body{
    margin:0;
    font-family:Tahoma, sans-serif;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:min(500px,90%);
    background:white;
    border-radius:16px;
    padding:24px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
}

h1{
    text-align:center;
    margin-top:0;
    color:#333;
}

.card{
    margin:20px 0;
}

h2{
    font-size:18px;
    margin-bottom:10px;
    color:#444;
}

audio{
    width:100%;
}

.footer{
    text-align:center;
    color:#888;
    margin-top:20px;
    font-size:13px;
}
</style>

</head>

<body>

<div class="container">

<h1>🎧 فایل‌های صوتی</h1>

<div class="card">
    <h2>فایل صوتی اول</h2>
    <audio controls preload="none">
        <source src="audio1.mp3" type="audio/mpeg">
        مرورگر شما از پخش صوت پشتیبانی نمی‌کند.
    </audio>
</div>


<div class="footer">
    با تشکر از همراهی شما 🌹
</div>

</div>

</body>
</html>
